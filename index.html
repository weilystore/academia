<!doctype html>

    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var origFetch = window.fetch ? window.fetch.bind(window) : null;
            var currentFetch = origFetch;

            // Add setter on Window.prototype if it is getter-only
            if (typeof Window !== 'undefined' && Window.prototype) {
              var desc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (desc && !desc.set && desc.configurable) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() {
                    return currentFetch || (desc.get ? desc.get.call(this) : origFetch);
                  },
                  set: function(val) {
                    currentFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            }

            // Also define setter on window itself to prevent strict-mode assignment errors
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              // fallback if window.fetch already non-configurable
            }
          }
        } catch (err) {
          console.warn('[Fetch Safeguard] Handled exception:', err);
        }
      })();
    </script>
